<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reimburse · Dashboard directions</title><style>
:root{--blue:#145cff;--ink:#111827;--muted:#667085;--bg:#f5f7fa;--surface:#fff;--line:#e7eaf0;--green:#16794a;--amber:#936300;--coral:#b8423b;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}a{color:inherit}.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}.nav{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:7px}.logo{font-weight:850;font-size:18px;margin:0 8px 32px}.nav a{padding:11px 12px;border-radius:10px;text-decoration:none;color:#697386;font-size:13px}.nav a.active{background:#eef3ff;color:var(--blue);font-weight:800}.nav .spacer{flex:1}.main{padding:32px 38px;max-width:1400px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.top h1{font-size:27px;margin:0 0 5px;letter-spacing:-.04em}.top p{margin:0;color:var(--muted);font-size:14px}.user{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:12px}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}.panel h2{font-size:15px;margin:0 0 5px}.panel .sub{font-size:12px;color:var(--muted);margin:0 0 18px}.attention{grid-row:span 2}.request{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:17px 0;border-top:1px solid var(--line)}.request strong{font-size:14px}.request small{display:block;color:var(--muted);margin-top:5px}.money{font-weight:850;font-size:15px;white-space:nowrap}.status{font-size:11px;font-weight:800;color:var(--coral);margin-top:6px;display:block}.status.pending{color:var(--amber)}.status.paid{color:var(--green)}.primary{border:0;background:var(--blue);color:#fff;padding:12px 15px;border-radius:10px;font-weight:800}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 12px;border-radius:10px;font-weight:700}.actionlist{display:grid;gap:9px}.action{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:#fff;padding:13px;border-radius:12px}.action b{display:block;font-size:13px}.action span{font-size:11px;color:var(--muted)}.icon{width:31px;height:31px;border-radius:9px;background:#eef3ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.timeline{display:flex;gap:7px;align-items:flex-start}.step{flex:1;font-size:11px;color:var(--muted);border-top:3px solid var(--line);padding-top:8px}.step.done{border-color:var(--green);color:var(--ink)}.step.current{border-color:var(--blue);color:var(--ink);font-weight:800}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:12px 15px;border-radius:10px;display:none}.toast.show{display:block}.bento .panel{border:0;box-shadow:0 8px 28px #16233a0b}.bento .attention{background:#111827;color:#fff}.bento .attention .sub,.bento .attention small{color:#b8c4d5}.bento .attention .request{border-color:#344054}.bento .attention .status{color:#f4bd4e}.bento .attention .secondary{background:#fff;color:#111827}.bento .actionlist{grid-template-columns:repeat(3,1fr)}.bento .action{min-height:98px;display:block}.bento .action .icon{margin-bottom:10px}.bento .timeline-panel{grid-column:span 2}.desk{--blue:#165dff;--bg:#f2f1ee}.desk .main{max-width:1220px}.desk .grid{grid-template-columns:1.25fr .75fr}.desk .attention{background:#fff;border-radius:24px;padding:28px}.desk .attention .request:first-of-type{background:#f8f9fb;border:0;border-radius:16px;padding:18px;margin-bottom:6px}.desk .timeline-panel{background:#fbfcff}.desk .actionlist{grid-template-columns:1fr 1fr 1fr}.desk .action{border-radius:20px;display:block;min-height:112px}.desk .action .icon{margin-bottom:18px}.desk .latest{grid-column:span 2}.workspace{--bg:#fff}.workspace .app{grid-template-columns:1fr}.workspace .nav{display:none}.workspace .main{max-width:1200px;padding:0 34px 50px}.workspace .top{height:74px;border-bottom:1px solid var(--line);margin:0 -34px 30px;padding:0 34px}.workspace .top h1{font-size:20px}.workspace .top p{display:none}.workspace .grid{grid-template-columns:1.6fr .8fr}.workspace .panel{border-radius:10px;box-shadow:none}.workspace .attention{grid-row:auto}.workspace .filter{display:flex;gap:6px;margin-bottom:18px}.workspace .filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px}.workspace .filter button.active{background:#111827;color:#fff;border-color:#111827}.workspace .action{border-radius:8px}.workspace .timeline-panel{grid-column:auto}.workspace .latest{grid-column:span 2}@media(max-width:760px){.app,.bento .app,.desk .app{display:block}.nav{display:none}.main,.workspace .main{padding:22px 16px 40px}.top,.workspace .top{height:auto;margin:0 0 24px;padding:0;border:0}.top h1{font-size:23px}.user{padding:8px 10px}.grid,.bento .grid,.desk .grid,.workspace .grid{display:flex;flex-direction:column;gap:12px}.panel,.bento .panel,.desk .panel{padding:18px;border-radius:16px}.attention{order:1}.actions-panel{order:2}.timeline-panel{order:3}.latest{order:4}.bento .actionlist,.desk .actionlist{display:grid;grid-template-columns:1fr}.bento .action,.desk .action{min-height:0;display:flex}.bento .action .icon,.desk .action .icon{margin:0}.workspace .top{display:flex}.workspace .filter{overflow:auto;margin-right:-16px;padding-bottom:4px}.workspace .filter button{white-space:nowrap}.request{align-items:flex-start}.money{font-size:13px}}@media(min-width:761px){.mobile-preview{display:none}}:focus-visible{outline:3px solid #145cff;outline-offset:3px}</style></head><body><div id="root"></div><div id="toast" class="toast" role="status"></div><script>
const data={attention:[['Parking reimbursement','REIM-000041 · Bukti perlu diperbaiki','Revision','Rp 1.250.000'],['Creator fee · Ramadan','PAY-000018 · Menunggu Finance','Pending','Rp 4.500.000']],latest:[['Office supplies','REIM-000038 · 24 Okt 2026','Paid','Rp 860.000'],['Overtime · Batch 3','OT-000012 · 22 Okt 2026','Finance Approved','Rp 420.000']]};function nav(){return `<aside class="nav"><div class="logo">Reimburse</div><a class="active" href="?direction=electric">Dashboard</a><a href="#attention">Pengajuan</a><a href="#latest">Bantuan</a><div class="spacer"></div><a href="#profile">Maya A.</a></aside>`}function rows(items){return items.map(x=>`<div class="request"><div><strong>${x[0]}</strong><small>${x[1]}</small><span class="status ${x[2]==='Paid'?'paid':x[2]==='Pending'?'pending':''}">${x[2]}</span></div><span class="money">${x[3]}</span></div>`).join('')}function actions(){return `<section class="panel actions-panel"><h2>Buat pengajuan</h2><p class="sub">Pilih pekerjaan yang ingin dimulai.</p><div class="actionlist"><button class="action" onclick="demo('Reimbursement siap dimulai')"><span class="icon">▣</span><span><b>Reimbursement</b><span>Invoice dan bukti transaksi</span></span></button><button class="action" onclick="demo('Payment Request siap dimulai')"><span class="icon">↗</span><span><b>Payment Request</b><span>Ajukan pembayaran vendor</span></span></button><button class="action" onclick="demo('Overtime siap dimulai')"><span class="icon">◷</span><span><b>Overtime</b><span>Catat jam kerja tambahan</span></span></button></div></section>`}function timeline(){return `<section class="panel timeline-panel"><h2>Status berjalan</h2><p class="sub">Pengajuan aktif bergerak dari validasi sampai pembayaran.</p><div class="timeline"><span class="step done">Dikirim</span><span class="step current">Finance review</span><span class="step">Approver</span><span class="step">Maker</span><span class="step">Paid</span></div></section>`}function dashboard(direction='electric'){let cls=direction==='electric'?'bento':direction==='desk'?'desk':'workspace';let title=direction==='workspace'?'Pengajuan saya':'Selamat pagi, Maya';let intro=direction==='workspace'?'Pantau status dan lanjutkan pekerjaanmu.':'Ada 2 pengajuan yang perlu perhatianmu.';return `<div class="${cls}"><div class="app">${nav()}<main class="main"><header class="top"><div><h1>${title}</h1><p>${intro}</p></div><button class="user" onclick="demo('Profil Maya dibuka')">Maya A.⌄</button></header>${direction==='workspace'?'<div class="filter"><button class="active">Semua</button><button>Perlu tindakan</button><button>Dalam proses</button><button>Selesai</button></div>':''}<div class="grid"><section class="panel attention" id="attention"><h2>${direction==='desk'?'Apa yang perlu kamu selesaikan?':'Perlu perhatian'}</h2><p class="sub">Revision membutuhkan tindakanmu sebelum bisa diproses kembali.</p>${rows(data.attention)}<button class="secondary" onclick="demo('Membuka daftar pengajuan')">Lihat semua pengajuan</button></section>${actions()}${timeline()}<section class="panel latest" id="latest"><h2>Pengajuan terbaru</h2><p class="sub">Status terakhir dari pengajuanmu.</p>${rows(data.latest)}</section></div></main></div></div>`}function demo(text){const t=document.getElementById('toast');t.textContent=text;t.className='toast show';setTimeout(()=>t.className='toast',1800)}function app(){let d=new URLSearchParams(location.search).get('direction')||'electric';document.getElementById('root').innerHTML=dashboard(d)}app();</script></body></html>
