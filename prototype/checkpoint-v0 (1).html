<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reimburse — UI/UX Prototype Gallery</title><style>
:root{--ink:#172536;--muted:#6c7887;--paper:#f4f6f8;--surface:#fff;--line:#dfe5eb;--accent:#2563eb;--accent-soft:#eaf1ff;--green:#16815d;--green-soft:#e6f6ef;--amber:#9a6511;--amber-soft:#fff3d8;--red:#b63e43;--red-soft:#fdebec;--purple:#6946a8;--purple-soft:#f0eaff;--r:11px;--shadow:0 14px 34px #172b3d12;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px;padding:0 12px 28px}.mark{width:30px;height:30px;background:var(--ink);border-radius:8px;color:#fff;display:grid;place-items:center;font-size:13px}.nav-title{font-size:10px;color:#9aa4af;letter-spacing:.12em;text-transform:uppercase;padding:14px 12px 6px}.nav a{display:flex;gap:10px;align-items:center;text-decoration:none;color:#667383;padding:10px 12px;border-radius:8px;margin:2px 0}.nav a:hover,.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:700}.signout{margin-top:auto}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 32px}.top small{color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:#f1d1bd;color:#713c28;display:grid;place-items:center;font-weight:700}.content{max-width:1320px;margin:auto;padding:30px}.headline{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px}.eyebrow{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.headline h1{font-size:29px;letter-spacing:-.035em;margin:5px 0}.headline p{color:var(--muted);margin:0}.primary{background:var(--accent);color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:750;box-shadow:0 5px 12px #2563eb28}.primary:hover{background:#1d4ed8}.ghost{background:white;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:650}.danger{color:var(--red);border-color:#efc4c6}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 11px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;text-align:left;min-height:140px}.service:hover{border-color:#a8c2f6;box-shadow:var(--shadow)}.service strong{font-size:13px}.service h3{font-size:16px;margin:18px 0 6px}.service p{font-size:13px;color:var(--muted);line-height:1.45;margin:0}.service .arrow{float:right;color:var(--accent);font-size:18px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}.task{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}.task strong{display:block;margin-bottom:5px}.task small{color:var(--muted)}.status{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750;white-space:nowrap}.pending{background:var(--amber-soft);color:var(--amber)}.approved{background:var(--green-soft);color:var(--green)}.revision{background:var(--amber-soft);color:var(--amber)}.paid{background:var(--green-soft);color:var(--green)}.rejected{background:var(--red-soft);color:var(--red)}.purple{background:var(--purple-soft);color:var(--purple)}.toolbar{display:flex;flex-wrap:wrap;gap:9px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:13px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);min-width:150px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:14px 15px;border-bottom:1px solid #edf0f3;white-space:nowrap}th{font-size:11px;color:#7c8793;text-transform:uppercase;letter-spacing:.06em;background:#fbfcfd}td{font-size:13px}tr:last-child td{border-bottom:0}tr[data-open]{cursor:pointer}tr[data-open]:hover{background:#f8faff}.form-shell{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750}.field input,.field select,.field textarea{width:100%;min-width:0;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.invoice{border:1px solid var(--line);padding:15px;border-radius:9px;background:#fbfcfd}.invoice-head{display:flex;justify-content:space-between;margin-bottom:13px}.upload{border:1px dashed #aebbc9;padding:11px;border-radius:8px;color:var(--muted);background:#fff;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line);padding-top:17px;margin-top:20px}.note{font-size:12px;color:var(--muted);margin-top:15px}.timeline{display:grid;gap:0}.timeline-item{display:grid;grid-template-columns:20px 1fr;gap:12px;min-height:60px}.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 4px var(--accent-soft)}.timeline-copy strong{display:block}.timeline-copy small{color:var(--muted)}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:15px}.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px}.metric small{color:var(--muted);display:block}.metric strong{font-size:24px;display:block;margin-top:8px}.gallery{position:fixed;right:20px;bottom:18px;background:var(--ink);color:#fff;border-radius:9px;padding:10px 13px;text-decoration:none;font-size:12px;z-index:4}.hidden{display:none!important}.mobile-nav{display:none}.toast{position:fixed;right:24px;bottom:22px;background:var(--ink);color:#fff;padding:12px 15px;border-radius:8px;z-index:8;box-shadow:var(--shadow)}.modal-back{position:fixed;inset:0;background:#15233466;display:grid;place-items:center;padding:20px;z-index:7}.modal{background:#fff;border-radius:12px;padding:22px;max-width:510px;width:100%;box-shadow:0 30px 80px #172b3d35}.modal h2{margin:0 0 8px;font-size:19px}.modal p{color:var(--muted);line-height:1.5}.checklist{display:grid;gap:8px}.check{display:flex;gap:9px;align-items:center;padding:9px;background:#f8fafc;border-radius:8px}.check input{accent-color:var(--accent)}.gallery-page{max-width:1400px;margin:auto;padding:28px}.gallery-header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.gallery-header h1{margin:4px 0;font-size:30px}.gallery-header p{color:var(--muted);margin:0}.gallery-layout{display:grid;grid-template-columns:275px 1fr;gap:18px}.gallery-side{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;height:max-content;position:sticky;top:18px}.gallery-side h3{font-size:13px;margin:7px 0 12px}.screen-list{display:grid;gap:4px}.screen-list button{text-align:left;background:transparent;border:0;padding:9px;border-radius:7px;color:var(--muted)}.screen-list button:hover,.screen-list button.active{background:var(--accent-soft);color:var(--accent);font-weight:700}.previews{display:grid;grid-template-columns:1fr 390px;gap:15px;align-items:start}.preview{background:#dfe5eb;border-radius:10px;padding:13px}.preview h3{font-size:11px;text-transform:uppercase;color:#586675;letter-spacing:.08em;margin:0 0 8px}.frame{background:#fff;min-height:560px;border-radius:7px;overflow:hidden}.frame.mobile{max-width:390px;margin:auto;min-height:700px}.frame iframe{display:block;border:0;width:100%;height:650px}.frame.mobile iframe{height:700px}.coverage{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px}.coverage table{min-width:0}.coverage td,.coverage th{padding:10px}.coverage td:last-child{white-space:normal}.iframe-shell{min-height:100vh}
@media(max-width:800px){.shell{display:block}.side{display:none}.top{height:58px;padding:0 17px}.content{padding:22px 16px 85px}.headline{display:block}.headline .primary{width:100%;margin-top:16px}.grid3,.two{grid-template-columns:1fr}.metric-row{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{position:sticky;bottom:0;background:#fff;margin:17px -22px -22px;padding:13px 22px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:8px}.mobile-nav a{font-size:11px;color:var(--muted);text-decoration:none;text-align:center}.mobile-nav a.active{color:var(--accent);font-weight:700}.gallery{display:none}.gallery-page{padding:18px}.gallery-layout{grid-template-columns:1fr}.gallery-side{position:static}.previews{grid-template-columns:1fr}.preview.desktop{display:none}.gallery-header{display:block}.frame.mobile{max-width:none}.frame.mobile iframe{height:680px}}
</style></head><body><div id="root"></div><script>
const screens={
 requester:{label:'Requester · Dashboard',path:'requester'}, admin:{label:'Admin · Queue',path:'admin'}, reim:{label:'Requester · Reimbursement',path:'reim'}, pay:{label:'Requester · Payment Request',path:'pay'}, ot:{label:'Requester · Overtime',path:'ot'}, detail:{label:'Admin · Request detail',path:'detail'}, wardrobe:{label:'Wardrobe database',path:'wardrobe'}, users:{label:'Admin · Users & access',path:'users'}, master:{label:'Admin · Master data',path:'master'}, states:{label:'State gallery',path:'states'}};
function shell(content,active='Dashboard',role='Requester'){return `<div class="shell"><aside class="side"><div class="brand"><span class="mark">R</span>Reimburse</div><nav class="nav"><div class="nav-title">Workspace</div><a class="${active==='Dashboard'?'active':''}" href="#requester">⌂ Dashboard</a><a href="#">▦ My Projects</a><a href="#">◷ Calendar</a><div class="nav-title">Finance</div><a class="${active==='Reimbursements'?'active':''}" href="#reim">▤ Reimbursements</a><a class="${active==='Payment Requests'?'active':''}" href="#pay">▤ Payment Requests</a><a class="${active==='Overtime'?'active':''}" href="#ot">◷ Overtime</a><div class="nav-title">Directory</div><a class="${active==='Wardrobe'?'active':''}" href="#wardrobe">⌂ Wardrobe</a><div class="nav-title">Admin</div><a class="${active==='Users'?'active':''}" href="#users">♙ Users & access</a><a class="${active==='Master data'?'active':''}" href="#master">⚙ Master data</a></nav><a class="nav signout" href="#">↪ Sign out</a></aside><main class="main"><header class="top"><small>${role} view · Acme Production</small><span class="avatar">MA</span></header><section class="content">${content}</section></main></div><nav class="mobile-nav"><a class="active" href="#requester">⌂<br>Home</a><a href="#reim">＋<br>New</a><a href="#admin">▤<br>Tasks</a><a href="#wardrobe">•••<br>More</a></nav>`}
const btn=(t,h,cls='ghost')=>`<button class="${cls}" onclick="location.hash='${h}'">${t}</button>`;
function requester(){return shell(`<div class="headline"><div><div class="eyebrow">Requester dashboard</div><h1>Good morning, Maya</h1><p>Track requests and start a new one.</p></div>${btn('＋ New reimbursement','reim','primary')}</div><div class="section-head"><h2>Available services</h2><span>3 services enabled</span></div><div class="grid3"><button class="service" onclick="location.hash='reim'"><strong>Reimbursement <span class="arrow">↗</span></strong><h3>Submit an expense</h3><p>Attach invoices, choose a cost category, and send for review.</p></button><button class="service" onclick="location.hash='pay'"><strong>Payment Request <span class="arrow">↗</span></strong><h3>Pay a partner</h3><p>For KOL, talent, and freelance payments.</p></button><button class="service" onclick="location.hash='ot'"><strong>Overtime <span class="arrow">↗</span></strong><h3>Log extra hours</h3><p>Submit overtime by project or batch.</p></button></div><div class="section-head"><h2>Needs your attention</h2><span>2 open items</span></div><div class="task"><div><strong>REIM-A-000041 · Parking reimbursement</strong><small>Finance requested a category correction · Updated 2 hours ago</small></div><span class="status revision">Revision</span></div><div style="height:9px"></div><div class="task"><div><strong>PAY-A-000018 · Biore Ramadan creator</strong><small>Waiting for vendor proof · Updated yesterday</small></div><span class="status pending">Pending vendor proof</span></div><div class="section-head"><h2>Recent requests</h2><span>View all</span></div><div class="task"><div><strong>REIM-A-000038 · Meals & Refreshments</strong><small>Rp 192.000 · 26 Oct 2026</small></div><span class="status paid">Paid</span></div><div class="note">Simulated data · local prototype only.</div>`,'Dashboard','Requester')}
function reim(){return shell(`<div class="headline"><div><div class="eyebrow">REIM · New request</div><h1>Submit an expense</h1><p>One cost category per request. Add one or more invoices.</p></div>${btn('Cancel','requester')}</div><div class="form-shell"><div class="form-grid"><div class="field"><label>Entity *</label><select><option>PT DAM</option></select></div><div class="field"><label>Brand</label><select><option>Affiliate Production Cost</option></select></div><div class="field"><label>Principal</label><input value="PT DAM" disabled></div><div class="field"><label>Quotation</label><select><option>Affiliate — 2026</option></select></div><div class="field"><label>Project / Batch</label><select><option>Affiliate — Period 1</option></select></div><div class="field"><label>Cost category *</label><select><option>Transportation</option><option>Meals & Refreshments</option><option>Props & Wardrobe</option></select></div><div class="field full"><label>Notes <span style="font-weight:400;color:#8a94a0">(optional)</span></label><textarea rows="3" placeholder="What should Finance know about this expense?"></textarea></div><div class="field full"><label>Invoices *</label><div class="invoice"><div class="invoice-head"><strong>Invoice 01</strong><span>Rp 50.000</span></div><div class="form-grid"><div class="field"><label>Invoice number</label><input value="INV-2026-1042"></div><div class="field"><label>Date</label><input type="date" value="2026-10-26"></div><div class="field"><label>Amount</label><input value="Rp 50.000"></div><div class="field"><label>Primary proof *</label><div class="upload">↑ invoice-parkir.jpg · 1.2 MB</div></div></div><div style="margin-top:12px"><label style="font-size:12px;font-weight:750">Additional proof</label><div class="upload" style="margin-top:7px">＋ Add file or link</div></div></div></div></div><div class="actions"><button class="ghost" onclick="toast('Draft saved · REIM-A-DRAFT-07')">Save draft</button><button class="primary" onclick="submitDemo()">Submit for review</button></div></div><div class="note">Images up to 10 MB · PDF up to 25 MB · OCR is optional and simulated.</div>`,'Reimbursements')}
function pay(){return shell(`<div class="headline"><div><div class="eyebrow">PAY · New request</div><h1>Payment Request</h1><p>One recipient, one quotation, one project context.</p></div>${btn('Cancel','requester')}</div><div class="form-shell"><div class="form-grid"><div class="field"><label>Recipient type *</label><select><option>KOL</option><option>Talent</option><option>Freelance</option></select></div><div class="field"><label>Recipient name *</label><input placeholder="Legal name"></div><div class="field"><label>Quotation *</label><select><option>Ramadan Series 2026</option></select></div><div class="field"><label>Project / Batch *</label><select><option>QL Management · Period 1</option></select></div><div class="field"><label>TikTok or Instagram *</label><input placeholder="https://..." value="https://instagram.com/creator"></div><div class="field"><label>Video portfolio</label><input placeholder="https://..."></div><div class="field"><label>Fee total *</label><input placeholder="Rp 0" value="Rp 8.500.000"></div><div class="field"><label>Payment type *</label><select><option>DP (50%)</option><option>Full Payment (100%)</option><option>Payment by TTO (100%)</option></select></div><div class="field"><label>Tax treatment *</label><select><option>Recommended: Individual — pending Admin confirmation</option></select></div><div class="field"><label>Invoice number *</label><input placeholder="INV-2026-001"></div><div class="field"><label>Invoice proof *</label><div class="upload">↑ Upload invoice or add link</div></div><div class="field"><label>Name sesuai KTP *</label><input placeholder="Legal name exactly as printed on KTP"></div><div class="field full"><label>MOU / Surat Kuasa</label><div class="upload">＋ Upload documents · Admin will configure requirement</div></div></div><div class="actions"><button class="ghost" onclick="toast('Draft saved · PAY-A-DRAFT-04')">Save draft</button><button class="primary" onclick="submitDemo()">Submit for review</button></div></div>`,'Payment Requests')}
function ot(){return shell(`<div class="headline"><div><div class="eyebrow">OT · New request</div><h1>Log overtime</h1><p>One Project / Batch with multiple dates.</p></div>${btn('Cancel','requester')}</div><div class="form-shell"><div class="form-grid"><div class="field"><label>Entity *</label><select><option>PT DAM</option></select></div><div class="field"><label>Project / Batch *</label><select><option>Content Production · Batch 3</option></select></div><div class="field"><label>Brand</label><select><option>Biore</option></select></div><div class="field"><label>Role</label><select><option>Editor</option><option>Videographer</option></select></div><div class="field full"><label>Overtime date 01 *</label><div class="invoice"><div class="form-grid"><div class="field"><label>Date</label><input type="date" value="2026-10-27"></div><div class="field"><label>Clock in</label><input type="time" value="18:00"></div><div class="field"><label>Clock out</label><input type="time" value="21:30"></div><div class="field"><label>Calculated</label><input value="3h 30m · Rp 350.000" disabled></div><div class="field full"><label>Proof</label><div class="upload">↑ overtime-27-oct.jpg · 2.1 MB · or add link</div></div></div></div></div><div class="field full"><label>Reason</label><textarea rows="3" placeholder="Required if configured by Project / Quotation"></textarea></div></div><div class="actions"><button class="ghost" onclick="toast('Draft saved · OT-A-DRAFT-02')">Save draft</button><button class="primary" onclick="submitDemo()">Submit for review</button></div></div>`,'Overtime')}
function admin(){return shell(`<div class="headline"><div><div class="eyebrow">Admin · Finance queue</div><h1>Work that needs a decision</h1><p>Review, approve, and move requests forward.</p></div><button class="ghost" onclick="toast('Export dialog: CSV · Excel · PDF')">↓ Export</button></div><div class="metric-row"><div class="metric"><small>Finance review</small><strong>12</strong></div><div class="metric"><small>Needs approval</small><strong>7</strong></div><div class="metric"><small>Ready to pay</small><strong>4</strong></div><div class="metric"><small>Vendor proof</small><strong>3</strong></div></div><div class="section-head"><h2>Queue</h2><span>Showing real-looking simulated records</span></div><div class="toolbar"><select><option>All services</option><option>Reimbursement</option><option>Payment Request</option><option>Overtime</option></select><select><option>All statuses</option><option>Pending</option><option>Revision</option></select><input placeholder="Search ID or requester"><button class="ghost" onclick="toast('Filters applied')">Filter</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Service</th><th>Requester</th><th>Context</th><th>Total</th><th>Age</th><th>Status</th></tr></thead><tbody><tr data-open onclick="location.hash='detail'"><td><strong>REIM-A-000041</strong></td><td>Reimbursement</td><td>Maya A.</td><td>Transportation · Biore</td><td>Rp 50.000</td><td>2h</td><td><span class="status revision">Revision</span></td></tr><tr data-open onclick="location.hash='detail'"><td><strong>PAY-A-000018</strong></td><td>Payment Request</td><td>Raka P.</td><td>KOL · Ramadan Series</td><td>Rp 8.5m</td><td>1d</td><td><span class="status pending">Pending vendor proof</span></td></tr><tr data-open onclick="location.hash='detail'"><td><strong>OT-A-000009</strong></td><td>Overtime</td><td>Fajar S.</td><td>Batch 3 · Editor</td><td>Rp 350.000</td><td>5h</td><td><span class="status pending">Pending</span></td></tr></tbody></table></div>`,'Dashboard','Admin')}
function detail(){return shell(`<div class="headline"><div><div class="eyebrow">REIM-A-000041 · Reimbursement</div><h1>Parking reimbursement</h1><p>Maya A. · submitted 26 Oct 2026</p></div><span class="status revision">Revision</span></div><div class="two"><div class="card"><div class="section-head"><h2>Request details</h2><span>Finance review</span></div><div class="form-grid"><div><small>Entity</small><strong style="display:block;margin-top:5px">PT DAM</strong></div><div><small>Category</small><strong style="display:block;margin-top:5px;color:var(--red)">Boost & Social Media Expenses</strong></div><div><small>Project</small><strong style="display:block;margin-top:5px">Other — PT DAM</strong></div><div><small>Total</small><strong style="display:block;margin-top:5px">Rp 50.000</strong></div></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="invoice"><div class="invoice-head"><strong>INV-2026-1042</strong><span>Rp 50.000</span></div><div class="upload">invoice-parkir.jpg · validated</div></div><div class="actions"><button class="ghost" onclick="openModal('revision')">Request revision</button><button class="ghost danger" onclick="openModal('reject')">Reject</button><button class="primary" onclick="approveDemo()">Finance approve</button></div></div><div class="card"><div class="section-head"><h2>Timeline</h2><span>Audit trail</span></div><div class="timeline"><div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-copy"><strong>Revision requested</strong><small>Admin · 2 hours ago<br>Category appears incorrect</small></div></div><div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-copy"><strong>Submitted</strong><small>Maya A. · 26 Oct 2026</small></div></div></div></div></div>`,'Reimbursements','Admin')}
function wardrobe(){return shell(`<div class="headline"><div><div class="eyebrow">Directory · Wardrobe</div><h1>Reusable items</h1><p>Reference items for production and PPM. Read-only for Requesters.</p></div><button class="ghost" onclick="toast('Wardrobe is reference-only in MVP')">View access</button></div><div class="toolbar"><input placeholder="Search item name"><select><option>All subcategories</option><option>Baju</option><option>Sepatu</option><option>Outer</option></select><select><option>Available items</option></select></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Subcategory</th><th>Size</th><th>Quantity</th><th>Condition</th><th>Added</th></tr></thead><tbody><tr><td><strong>Outer linen sand</strong></td><td>Outer</td><td>M</td><td>2</td><td><span class="status approved">Good</span></td><td>26 Oct 2026</td></tr><tr><td><strong>White shirt basic</strong></td><td>Baju</td><td>L</td><td>4</td><td><span class="status approved">Good</span></td><td>21 Oct 2026</td></tr><tr><td><strong>Canvas sneakers</strong></td><td>Sepatu</td><td>42</td><td>1</td><td><span class="status pending">Review</span></td><td>20 Oct 2026</td></tr></tbody></table></div>`,'Wardrobe','Admin')}

function submitDemo(){toast('Submitted · new request is now Pending');setTimeout(()=>location.hash='requester',700)}function approveDemo(){toast('Finance Approved · sent to Approver');setTimeout(()=>location.hash='admin',700)}function openModal(type){const title=type==='reject'?'Reject request':'Request revision';const copy=type==='reject'?'This cannot be edited later. Reason is required.':'Select fields and write a public instruction.';document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal"><h2>${title}</h2><p>${copy}</p><div class="checklist"><label class="check"><input type="checkbox" checked> Cost category</label><label class="check"><input type="checkbox"> Invoice proof</label></div><textarea style="width:100%;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px" rows="3" placeholder="Reason / instruction required"></textarea><div class="actions"><button class="ghost" onclick="document.getElementById('modal').remove()">Cancel</button><button class="primary" onclick="document.getElementById('modal').remove();toast('${title} saved')">Save decision</button></div></div></div>`)}function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function app(){let p=location.hash.slice(1)||'requester';const html=({requester,admin,reim,pay,ot,detail,wardrobe,users,master,states}[p]||requester)();document.getElementById('root').innerHTML=html;window.scrollTo(0,0)}window.addEventListener('hashchange',app);app();
